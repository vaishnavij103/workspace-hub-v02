services:
  - type: web
    name: apexon-workspace-hub-v02
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      npm install --legacy-peer-deps
      npm run build

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.4
